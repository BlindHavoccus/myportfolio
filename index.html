<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=Orbitron:wght@500;700&amp;display=swap">
  <link rel="icon" href="media/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="site-header">
    <a id="site-name" class="brand" href="#/home">Portfolio</a>
    <nav class="nav-links" aria-label="Main">
      <a id="home-link" class="glow" href="#/home" data-route="home" data-i18n="nav_home">Home</a>
      <a id="about-link" class="glow" href="#/about" data-route="about" data-i18n="nav_about">About</a>
      <div class="work">
        <button id="work-btn" class="glow" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="work-menu">
          <span data-i18n="nav_work">My work</span> <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div id="work-menu" class="menu" role="menu"></div>
      </div>
      <a id="shop-link" class="glow" href="#/shop" data-route="shop" data-i18n="nav_shop">Shop</a>
      <a id="contact-link" class="glow" href="#/contact" data-route="contact" data-i18n="nav_contact">Contact</a>
      <div id="lang" class="lang-group" role="group" aria-label="Language"></div>
    </nav>
  </header>

  <main id="view">
    <section id="view-home" class="view" aria-label="Home" hidden>
      <div id="home-inner"></div>
    </section>

    <section id="view-canvas" class="view" aria-label="Infinite canvas">
      <div class="canvas-head">
        <img id="canvas-banner" class="canvas-banner" alt="" draggable="false">
      </div>
      <div id="viewport">
        <div id="stage">
          <div id="world"></div>
        </div>
      </div>
    </section>

    <section id="view-gallery" class="view" aria-label="Gallery" hidden>
      <div id="gallery-stage">
        <div id="gallery-cats"></div>
        <div id="gallery-stack" hidden></div>
      </div>
    </section>

    <section id="view-writings" class="view" aria-label="Writings" hidden>
      <div id="writings-inner"></div>
    </section>

    <section id="view-shop" class="view" aria-label="Shop" hidden>
      <div id="shop-inner"></div>
    </section>

    <section id="view-music" class="view" aria-label="Music" hidden>
      <div id="music-inner"></div>
    </section>

    <section id="view-about" class="view" aria-label="About" hidden>
      <div id="about-inner"></div>
    </section>

    <section id="view-contact" class="view" aria-label="Contact" hidden>
      <div id="contact-inner"></div>
    </section>
  </main>

  <footer id="site-footer">
    <p id="footer-text" class="footer-text"></p>
    <div id="hud" hidden>
      <button id="seams" class="glow" type="button" data-i18n="seams_show">Show seams (G)</button>
      <button id="reset" class="glow" type="button" data-i18n="reset">Reset view (R)</button>
    </div>
    <div id="lang-footer" class="lang-group" role="group" aria-label="Language"></div>
  </footer>

  <div id="message" role="alert"></div>

  <div id="detail" role="dialog" aria-modal="true">
    <div id="detail-inner">
      <div id="detail-media"></div>
      <div id="detail-text"></div>
    </div>
    <button id="detail-close" class="glow" type="button" aria-label="Close">×</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
